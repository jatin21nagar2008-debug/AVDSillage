<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <!-- Circular Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle -->
    <rect width="100" height="100" rx="22" fill="#0F5132"/>
    <rect x="3" y="3" width="94" height="94" rx="19" stroke="#EAB308" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
    
    <!-- Sunburst glow behind maize -->
    <circle cx="50" cy="50" r="28" fill="#166534"/>

    <!-- Silage Corn Cob -->
    <path d="M50 22C43 28 42 37 42 52C42 67 50 74 50 74C50 74 58 67 58 52C58 37 57 28 50 22Z" fill="#EAB308"/>
    
    <!-- Kernels Pattern -->
    <line x1="50" y1="28" x2="50" y2="68" stroke="#CA8A04" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="38" x2="55" y2="38" stroke="#CA8A04" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="44" y1="46" x2="56" y2="46" stroke="#CA8A04" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="44" y1="54" x2="56" y2="54" stroke="#CA8A04" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="46" y1="62" x2="54" y2="62" stroke="#CA8A04" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Organic Green Leaves -->
    <path d="M42 54C33 54 27 61 29 72C36 74 45 66 45 57" fill="#22C55E"/>
    <path d="M58 54C67 54 73 61 71 72C64 74 55 66 55 57" fill="#16A34A"/>
    
    <!-- Small star or accent -->
    <circle cx="50" cy="80" r="2.5" fill="#FEF08A"/>
  </g>

  <!-- Typography -->
  <text x="130" y="52" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#0F5132" letter-spacing="1">AVD</text>
  <text x="238" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#EAB308" letter-spacing="2">SILAGE</text>
  
  <text x="132" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#1E293B" letter-spacing="4">SOLUTIONS PVT. LTD.</text>
  
  <rect x="132" y="87" width="370" height="1.5" fill="#E2E8F0"/>
  <rect x="132" y="87" width="70" height="2" fill="#EAB308"/>
  
  <text x="132" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10.5" fill="#64748B" letter-spacing="1.5">PREMIUM LIVESTOCK FODDER &amp; CORN SILAGE • HARDA, MP</text>
</svg>
